<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kasetti">
  <link rel="manifest" href="manifest.json">
  <title>Kasettilaskuri</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{background:#f5f2ec;font-family:'Courier New',Courier,monospace;height:100dvh;overflow:hidden;padding:max(env(safe-area-inset-top),16px) 16px env(safe-area-inset-bottom,16px);}
    #app{max-width:560px;margin:0 auto;height:calc(100dvh - max(env(safe-area-inset-top),16px) - env(safe-area-inset-bottom,16px));display:flex;flex-direction:column;gap:10px;}
    button{min-height:40px;touch-action:manipulation;}
    .header-sub{font-size:10px;letter-spacing:.15em;color:#999;text-transform:uppercase;margin-bottom:2px;}
    .header-title{font-size:20px;font-weight:bold;color:#2a2a26;}
    .card{background:#fff;border:1px solid #d8d4cc;border-radius:2px;padding:14px 16px;margin-bottom:10px;}
    .label{font-size:10px;color:#999;letter-spacing:.12em;margin-bottom:8px;}
    .screen-body{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;}
    .measurements-area{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;}
    .section-hint{font-size:10px;color:#999;letter-spacing:.12em;}
    .controls-stack{flex-shrink:0;padding-top:4px;}
    .controls-stack .card:last-child{margin-bottom:0;}
    .input-row{display:flex;gap:8px;}
    input.expr{flex:1;border:1px solid #d0ccc4;border-radius:2px;padding:10px 12px;font-size:16px;font-family:inherit;background:#faf9f7;color:#2a2a26;outline:none;min-width:0;}
    input.expr.err{border-color:#c06050;}
    input.expr::placeholder{color:#ccc;}
    .btn-add{background:#1f4033;border:1px solid #1f4033;border-radius:2px;color:#f8efe0;font-size:13px;font-family:inherit;font-weight:bold;padding:10px 16px;cursor:pointer;letter-spacing:.08em;white-space:nowrap;box-shadow:0 2px 0 #163126;}
    .err-msg{color:#c06050;font-size:11px;margin-top:6px;}
    .preset-row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;}
    .btn-preset{background:#fffaf0;border:1px solid #ceb37b;border-radius:2px;font-size:13px;font-family:inherit;padding:8px 12px;cursor:pointer;font-weight:bold;box-shadow:0 2px 0 #eadfca;}
    .btn-preset-del{background:#fff;border:1px solid #e0b0a8;color:#c06050;font-size:12px;cursor:pointer;padding:0 8px;border-radius:2px;min-height:32px;}
    .btn-text{background:#fff;border:1px solid #d0ccc4;border-radius:2px;font-family:inherit;cursor:pointer;letter-spacing:.08em;padding:6px 10px;color:#6f685f;}
    .preset-add-input{width:58px;border:1px solid #d0ccc4;border-radius:2px;padding:5px 8px;font-size:13px;font-family:inherit;background:#faf9f7;color:#2a2a26;outline:none;}
    .preview-wrap{margin-top:10px;border-top:1px dashed #e0ddd8;padding-top:8px;}
    .chips{display:flex;flex-wrap:wrap;gap:3px 6px;}
    .chip{font-size:11px;color:#c8a86b;background:#faf7f0;border:1px solid #e8dfc8;border-radius:2px;padding:2px 6px;}
    .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;align-items:center;}
    .tab-wrap{display:flex;align-items:center;gap:3px;flex-shrink:0;}
    .btn-tab{border-radius:2px;font-size:12px;font-family:inherit;padding:8px 12px;cursor:pointer;white-space:nowrap;font-weight:bold;}
    .tab-rename{border:1px solid #c8a86b;border-radius:2px;padding:5px 8px;font-size:13px;font-family:inherit;color:#2a2a26;background:#fff;outline:none;width:90px;}
    .btn-tab-del{border-radius:2px;font-size:10px;padding:5px 9px;cursor:pointer;font-family:inherit;white-space:nowrap;min-height:34px;}
    .btn-add-section{background:#fff;border:1px dashed #b9b0a1;border-radius:2px;color:#7f776b;font-size:12px;font-family:inherit;padding:8px 12px;cursor:pointer;flex-shrink:0;font-weight:bold;}
    .table-wrap{display:flex;flex-direction:column;flex:1;min-height:0;}
    .table-head{display:grid;grid-template-columns:28px 28px minmax(72px,1fr) minmax(96px,1.2fr) 30px 24px 24px;background:#f0ede8;border-bottom:1px solid #d8d4cc;padding:7px 10px;font-size:10px;color:#999;letter-spacing:.1em;gap:4px;}
    .table-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-behavior:auto;min-height:0;}
    .row{display:grid;grid-template-columns:28px 28px minmax(72px,1fr) minmax(96px,1.2fr) 30px 24px 24px;padding:7px 10px;gap:4px;align-items:center;border-bottom:1px solid #f0ede8;cursor:pointer;background:#fff;}
    .row.checked{background:#f7f5f0;}
    .row.dragging{background:#fff8ee;box-shadow:inset 0 0 0 1px #e8d4a0;}
    .checkbox{width:16px;height:16px;border:2px solid #ccc;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:bold;flex-shrink:0;}
    .checkbox.on{background:#c8a86b;border-color:#c8a86b;}
    .row-num{font-size:11px;color:#bbb;}
    .row-val{font-size:14px;font-weight:bold;}
    .row-val.struck{color:#bbb;text-decoration:line-through;}
    .row-total{font-size:14px;font-weight:bold;color:#2a2a26;}
    .row-total.dim{color:#bbb;font-weight:normal;}
    .row-abs{font-size:10px;color:#bbb;margin-left:4px;}
    .btn-zero{background:#fff;border:1px solid #d9cfbf;border-radius:2px;color:#9a8d79;font-size:11px;padding:2px 4px;cursor:pointer;line-height:1;min-height:28px;}
    .btn-zero.on{border-color:#c8a86b;color:#c8a86b;}
    .row-del{color:#bbaea2;font-size:14px;text-align:center;cursor:pointer;font-weight:bold;}
    .row-drag{display:flex;align-items:center;justify-content:center;color:#c8a86b;border:1px dashed #d8c49a;border-radius:2px;background:#fffaf0;font-size:12px;font-weight:bold;min-height:28px;touch-action:none;}
    .row-drag.off{opacity:.35;border-color:#ebe6dd;color:#cfc7bb;background:#faf9f7;pointer-events:none;}
    .zero-sep{display:flex;align-items:center;gap:8px;padding:4px 10px;background:#fff8ee;border-bottom:1px solid #f0e8d0;border-top:1px solid #f0e8d0;}
    .zero-sep-line{flex:1;height:1px;background:#e8d4a0;}
    .zero-sep-label{font-size:10px;color:#c8a86b;letter-spacing:.1em;white-space:nowrap;}
    .table-footer{border-top:2px solid #d8d4cc;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;background:#faf9f7;}
    .footer-meta{font-size:11px;color:#999;}
    .footer-right{text-align:right;}
    .footer-checked{font-size:11px;color:#bbb;margin-bottom:2px;}
    .footer-grand{font-size:16px;font-weight:bold;color:#2a2a26;}
    .actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;}
    .btn-action{background:#fff;border:1px solid #bfb7aa;border-radius:2px;font-size:11px;font-family:inherit;padding:8px 12px;cursor:pointer;letter-spacing:.06em;font-weight:bold;}
    .btn-action.danger{border-color:#c06050;color:#c06050;background:#fff7f5;}
    .btn-action.normal{color:#6f685f;}
    .empty{text-align:center;padding:40px 0;color:#ccc;font-size:12px;letter-spacing:.08em;}
    .edit-note{margin-top:8px;font-size:10px;color:#a28655;letter-spacing:.08em;}
    button:focus-visible{outline:2px solid #c8a86b;outline-offset:2px;}
    button:active{transform:translateY(1px);box-shadow:none;}
    @media (max-width:480px){
      body{padding:max(env(safe-area-inset-top),12px) 12px env(safe-area-inset-bottom,12px);}
      .card{padding:12px;}
      .table-head,.row{grid-template-columns:24px 24px minmax(64px,1fr) minmax(82px,1.1fr) 28px 22px 22px;padding:7px 8px;}
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
const STORAGE_KEY = 'kasetti_v3';
const PALETTE = ['#4a7a9b','#7a6a4a','#6a8a5a','#7a4a6a','#4a6a7a','#9b6a3a','#5a6a9b','#8a7a4a'];

function uid(){return Math.random().toString(36).slice(2,9);}
function fmt(n){return n.toLocaleString('fi-FI');}

function parseExpr(str){
  if(!str.trim())return null;
  const parts=str.trim().split('+');
  const result=[];
  for(const part of parts){
    const m=part.trim().match(/^(\d+)[xX*](\d+)$/);
    if(m)result.push({value:parseInt(m[1]),count:parseInt(m[2])});
    else if(/^\d+$/.test(part.trim()))result.push({value:parseInt(part.trim()),count:1});
    else return null;
  }
  return result;
}
function expand(parsed){
  const out=[];
  for(const{value,count}of parsed)for(let i=0;i<count;i++)out.push(value);
  return out;
}
function makeRow(value){return{id:uid(),value,checked:false};}
function migrateSection(s){return{...s,rows:(s.rows||[]).map(r=>r.id?r:{...r,id:uid()}),zeroPointIds:s.zeroPointIds||[]};}
function makeDefault(){const id=uid();return{sections:[{id,name:'Seinä 1',rows:[],zeroPointIds:[]}],activeId:id,presets:[330,630]};}

function loadData(){
  try{const s=localStorage.getItem(STORAGE_KEY);if(s){const d=JSON.parse(s);d.sections=d.sections.map(migrateSection);return d;}}catch{}
  return makeDefault();
}
function saveData(d){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch{}}

// ── State ──────────────────────────────────────────────────────────────────
let data=loadData();
let expr='',error='',preview=null,editMode=false,newPreset='';
let confirmDelete=null,confirmTimer=null;
let renamingId=null,renameVal='';
let previewTimer=null;
let pendingScrollToLatest=false;
let draggingRowId=null;
let hideControls=false;

function save(){saveData(data);}

function section(){return data.sections.find(s=>s.id===data.activeId)||data.sections[0];}
function presetColor(v){const i=data.presets.indexOf(v);return i>=0?PALETTE[i%PALETTE.length]:'#2a2a26';}
function queueScrollToLatest(){pendingScrollToLatest=true;}
function scrollLatestIntoView(){
  if(!pendingScrollToLatest)return;
  pendingScrollToLatest=false;
  requestAnimationFrame(()=>{
    const body=document.querySelector('.table-body');
    const latest=body?.querySelector('.row:last-of-type');
    if(!body||!latest)return;
    body.scrollTop=Math.max(0,latest.offsetTop+latest.offsetHeight-body.clientHeight);
  });
}
function setSectionRows(nextRows){
  data.sections=data.sections.map(s=>s.id===data.activeId?{...s,rows:nextRows}:s);
}
function startRowDrag(event,id){
  if(!editMode)return;
  event.preventDefault();
  event.stopPropagation();
  draggingRowId=id;
  document.addEventListener('pointermove',handleRowDragMove);
  document.addEventListener('pointerup',endRowDrag);
  document.addEventListener('pointercancel',endRowDrag);
  render();
}
function handleRowDragMove(event){
  if(!draggingRowId)return;
  const rowEl=document.elementFromPoint(event.clientX,event.clientY)?.closest('.row');
  const overId=rowEl?.dataset.rowId;
  if(!overId||overId===draggingRowId)return;
  const rows=section().rows.slice();
  const from=rows.findIndex(r=>r.id===draggingRowId);
  const to=rows.findIndex(r=>r.id===overId);
  if(from<0||to<0)return;
  const[moved]=rows.splice(from,1);
  rows.splice(to,0,moved);
  setSectionRows(rows);
  save();
  render();
}
function endRowDrag(){
  if(!draggingRowId)return;
  draggingRowId=null;
  document.removeEventListener('pointermove',handleRowDragMove);
  document.removeEventListener('pointerup',endRowDrag);
  document.removeEventListener('pointercancel',endRowDrag);
  render();
}

// ── Mutations ──────────────────────────────────────────────────────────────
function updateSection(fn){
  data.sections=data.sections.map(s=>s.id===data.activeId?{...s,...fn(s)}:s);
  save();render();
}
function updateRows(fn){updateSection(s=>({rows:fn(s.rows)}));}

function handleAdd(){
  if(!expr.trim())return;
  const parsed=parseExpr(expr);
  if(!parsed){error='Tarkista syöte, esim. 330x4+630x2';render();return;}
  error='';
  queueScrollToLatest();
  updateRows(rows=>[...rows,...expand(parsed).map(makeRow)]);
  expr='';preview=null;
  render();
  document.querySelector('input.expr')?.focus();
}

function handleExprInput(val){
  expr=val;error='';
  clearTimeout(previewTimer);
  previewTimer=setTimeout(()=>{
    if(!val.trim()){preview=null;render();return;}
    const p=parseExpr(val);
    preview=p?expand(p):null;render();
  },120);
}

function toggleCheck(id){updateRows(rows=>rows.map(r=>r.id===id?{...r,checked:!r.checked}:r));}
function removeRow(id){
  updateSection(s=>({rows:s.rows.filter(r=>r.id!==id),zeroPointIds:(s.zeroPointIds||[]).filter(z=>z!==id)}));
}
function toggleZero(id){
  updateSection(s=>{const z=s.zeroPointIds||[];return{zeroPointIds:z.includes(id)?z.filter(x=>x!==id):[...z,id]};});
}
function clearChecks(){updateRows(rows=>rows.map(r=>({...r,checked:false})));}
function resetSection(){if(window.confirm(`Nollataan ${section().name}?`))updateSection(()=>({rows:[],zeroPointIds:[]}));}

function addSection(){
  const id=uid(),n=data.sections.length+1;
  data.sections.push({id,name:`Seinä ${n}`,rows:[],zeroPointIds:[]});
  data.activeId=id;save();render();
}
function deleteSection(id){
  if(data.sections.length<=1)return;
  data.sections=data.sections.filter(s=>s.id!==id);
  if(data.activeId===id)data.activeId=data.sections[data.sections.length-1].id;
  confirmDelete=null;save();render();
}
function requestDelete(id){
  if(confirmDelete===id){deleteSection(id);return;}
  confirmDelete=id;clearTimeout(confirmTimer);
  confirmTimer=setTimeout(()=>{confirmDelete=null;render();},3000);
  render();
}
function startRename(s){renamingId=s.id;renameVal=s.name;render();setTimeout(()=>{const el=document.querySelector('.tab-rename');if(el){el.focus();el.select();}},40);}
function commitRename(){
  if(renameVal.trim())data.sections=data.sections.map(s=>s.id===renamingId?{...s,name:renameVal.trim()}:s);
  renamingId=null;save();render();
}
function addPreset(){
  const v=parseInt(newPreset);
  if(!v||data.presets.includes(v))return;
  data.presets.push(v);newPreset='';save();render();
}
function removePreset(v){data.presets=data.presets.filter(p=>p!==v);save();render();}

// ── Render ─────────────────────────────────────────────────────────────────
function render(){
  const sec=section();
  const rows=sec.rows;
  const zeroIds=new Set(sec.zeroPointIds||[]);

  let segR=0,absR=0;
  const display=rows.map(r=>{
    const isZero=zeroIds.has(r.id);
    if(isZero)segR=0;
    segR+=r.value;absR+=r.value;
    return{...r,segTotal:segR,absTotal:absR,isZero};
  });

  const grandTotal=rows.reduce((s,r)=>s+r.value,0);
  const checkedCount=rows.filter(r=>r.checked).length;
  const checkedTotal=rows.filter(r=>r.checked).reduce((s,r)=>s+r.value,0);

  let previewRunning=grandTotal;
  const previewChips=(preview||[]).map(v=>{previewRunning+=v;return{v,t:previewRunning};});

  // Tabs
  const tabsHtml=data.sections.map(s=>{
    const active=s.id===data.activeId,pending=confirmDelete===s.id;
    const tabBtn=active&&renamingId===s.id
      ?`<input class="tab-rename" value="${renameVal.replace(/"/g,'&quot;')}" onchange="renameVal=this.value" oninput="renameVal=this.value" onblur="commitRename()" onkeydown="if(event.key==='Enter')commitRename();if(event.key==='Escape'){renamingId=null;render();}"/>`
      :`<button class="btn-tab" style="background:${active?'#2a2a26':'#f0ede8'};border:1px solid ${active?'#2a2a26':'#d0ccc4'};color:${active?'#c8a86b':'#888'};" onclick="${active?`startRename(data.sections.find(s=>s.id==='${s.id}'))`:`data.activeId='${s.id}';save();render()`}">${s.name}${active?'<span style="margin-left:4px;font-size:9px;opacity:.5">✎</span>':''}</button>`;
    const delBtn=data.sections.length>1
      ?`<button class="btn-tab-del" style="background:${pending?'#c06050':'transparent'};border:1px solid ${pending?'#c06050':'#e0ddd8'};color:${pending?'#fff':'#ccc'};" onclick="requestDelete('${s.id}')">${pending?'poista?':'✕'}</button>`:'';
    return`<div class="tab-wrap">${tabBtn}${delBtn}</div>`;
  }).join('');

  // Presets
  const presetsHtml=data.presets.map(v=>`
    <div style="display:flex;align-items:center;gap:3px;">
      <button class="btn-preset" style="color:${presetColor(v)};" onclick="queueScrollToLatest();updateRows(rows=>[...rows,makeRow(${v})])">+${v}</button>
      ${editMode?`<button class="btn-preset-del" onclick="removePreset(${v})">✕</button>`:''}
    </div>`).join('');
  const presetAddHtml=editMode?`
    <div style="display:flex;gap:4px;align-items:center;">
      <input class="preset-add-input" placeholder="uusi" value="${newPreset}" oninput="newPreset=this.value" onkeydown="if(event.key==='Enter')addPreset()">
      <button class="btn-action normal" onclick="addPreset()">+</button>
    </div>`:'';

  // Preview chips
  const previewHtml=previewChips.length?`
    <div class="preview-wrap">
      <div class="label">ESIKATSELU · ${previewChips.length} mittaa, +${fmt(preview.reduce((s,v)=>s+v,0))} mm</div>
      <div class="chips">${previewChips.map(({v,t})=>`<span class="chip">${fmt(v)} → <strong>${fmt(t)}</strong></span>`).join('')}</div>
    </div>`:'';

  // Rows
  const rowsHtml=display.map((r,i)=>{
    const sep=r.isZero?`<div class="zero-sep"><div class="zero-sep-line"></div><span class="zero-sep-label">↺ TEIPPI NOLLATTU</span><div class="zero-sep-line"></div></div>`:'';
    const absLabel=r.segTotal!==r.absTotal?`<span class="row-abs">/${fmt(r.absTotal)}</span>`:'';
    return`${sep}
    <div class="row${r.checked?' checked':''}${draggingRowId===r.id?' dragging':''}" data-row-id="${r.id}" onclick="${editMode?'void(0)':`toggleCheck('${r.id}')`}">
      <div class="checkbox${r.checked?' on':''}">${r.checked?'✓':''}</div>
      <span class="row-num">${i+1}</span>
      <span class="row-val${r.checked?' struck':''}" style="color:${r.checked?'#bbb':presetColor(r.value)}">${fmt(r.value)}</span>
      <div><span class="row-total${r.checked?' dim':''}">${fmt(r.segTotal)}</span>${absLabel}</div>
      <button class="btn-zero${r.isZero?' on':''}" onclick="event.stopPropagation();toggleZero('${r.id}')">↺</button>
      <span class="row-del" onclick="event.stopPropagation();removeRow('${r.id}')">✕</span>
      <div class="row-drag${editMode?'':' off'}" onpointerdown="startRowDrag(event,'${r.id}')">↕</div>
    </div>`;
  }).join('');

  const tableHtml=rows.length?`
    <div class="card table-wrap" style="padding:0;overflow:hidden;">
      <div class="table-head"><span>✓</span><span>#</span><span>MITTA</span><span>JUOKSEVA</span><span>↺</span><span>✕</span><span>${editMode?'↕':''}</span></div>
      <div class="table-body">${rowsHtml}</div>
      <div class="table-footer">
        <div class="footer-meta">${rows.length} mittaa · ${checkedCount} merkitty</div>
        <div class="footer-right">
          ${checkedCount?`<div class="footer-checked">Merkitty: ${fmt(checkedTotal)} mm</div>`:''}
          <div class="footer-grand">Yht. ${fmt(grandTotal)} mm</div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn-action normal" onclick="hideControls=!hideControls;render()">${hideControls?'NÄYTÄ NAPIT':'PIILOTA NAPIT'}</button>
      <button class="btn-action normal" onclick="clearChecks()">TYHJENNÄ MERKIT</button>
      <button class="btn-action danger" onclick="resetSection()">NOLLAA LISTA</button>
    </div>`:`<div class="card table-wrap" style="display:flex;justify-content:center;margin-bottom:0;"><div class="empty">Lisää mittoja syöttökentästä</div></div>`;

  document.getElementById('app').innerHTML=`
    <div class="header-sub">Metallijulkisivu · Kasettilaskuri</div>
    <div class="header-title">Moduulimittalista</div>
    <div class="screen-body">
      <div class="measurements-area">
        <div class="section-hint">Mittalista pysyy ylhäällä, syöttö alhaalla peukalon kohdalla.</div>
        ${tableHtml}
      </div>
      ${hideControls?'':`<div class="controls-stack">
        <div class="card">
          <div class="label">SYÖTE · esim. <span style="color:#c8a86b">330x4+630x2+330</span></div>
          <div class="input-row">
            <input class="expr${error?' err':''}" type="text" inputmode="decimal" placeholder="330x4+630x5" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${expr.replace(/"/g,'&quot;')}" oninput="handleExprInput(this.value)" onkeydown="if(event.key==='Enter')handleAdd()">
            <button class="btn-add" onclick="handleAdd()">+ LISÄÄ</button>
          </div>
          ${error?`<div class="err-msg">${error}</div>`:''}
          <div class="preset-row">
            ${presetsHtml}${presetAddHtml}
            <button class="btn-text" style="margin-left:auto;font-size:11px;color:${editMode?'#c8a86b':'#6f685f'};" onclick="editMode=!editMode;render()">${editMode?'valmis':'muokkaa'}</button>
          </div>
          ${editMode?'<div class="edit-note">Muokkaustila: vedä rivejä kahvasta, poista rivejä ja hallitse pikapainikkeita.</div>':''}
          ${previewHtml}
        </div>
        <div class="card">
          <div class="tabs">${tabsHtml}<button class="btn-add-section" onclick="addSection()">+ seinä</button></div>
        </div>
      </div>`}
    </div>
  `;

  scrollLatestIntoView();
}

render();
