<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kasetti">
  <link rel="manifest" href="manifest.json">
  <title>Kasettilaskuri</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #f5f2ec; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const STORAGE_KEY = 'kasetti_v3';
const PALETTE = ['#4a7a9b','#7a6a4a','#6a8a5a','#7a4a6a','#4a6a7a','#9b6a3a','#5a6a9b','#8a7a4a'];

function uid() { return Math.random().toString(36).slice(2,9); }
const fmt = (n) => n.toLocaleString('fi-FI');

function parseExpr(str) {
  if (!str.trim()) return null;
  const parts = str.trim().split(/\+/);
  const result = [];
  for (const part of parts) {
    const m = part.trim().match(/^(\d+)[xX*](\d+)$/);
    if (m) result.push({ value: parseInt(m[1]), count: parseInt(m[2]) });
    else if (/^\d+$/.test(part.trim())) result.push({ value: parseInt(part.trim()), count: 1 });
    else return null;
  }
  return result;
}
function expand(parsed) {
  const out = [];
  for (const { value, count } of parsed) for (let i = 0; i < count; i++) out.push(value);
  return out;
}
const makeRow = (value) => ({ id: uid(), value, checked: false });

function migrateSection(s) {
  return { ...s, rows: (s.rows||[]).map(r => r.id ? r : {...r, id:uid()}), zeroPointIds: s.zeroPointIds||[] };
}
function makeDefault() {
  const id = uid();
  return { sections:[{ id, name:'Seinä 1', rows:[], zeroPointIds:[] }], activeId:id, presets:[330,630] };
}

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const d = JSON.parse(saved);
      d.sections = d.sections.map(migrateSection);
      return d;
    }
  } catch {}
  return makeDefault();
}
function saveData(d) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {}
}

export default function App() {
  const [data, setData] = useState(() => loadData());
  const [expr, setExpr] = useState('');
  const [error, setError] = useState('');
  const [preview, setPreview] = useState(null);
  const [editingPresets, setEditingPresets] = useState(false);
  const [newPreset, setNewPreset] = useState('');
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [renamingId, setRenamingId] = useState(null);
  const [renameVal, setRenameVal] = useState('');
  const inputRef = useRef(null);
  const renameRef = useRef(null);
  const previewTimer = useRef(null);
  const confirmTimer = useRef(null);

  const update = (fn) => setData(prev => {
    const next = fn(prev);
    saveData(next);
    return next;
  });

  const section = data.sections.find(s => s.id === data.activeId) || data.sections[0];
  const rows = section.rows;
  const zeroIds = new Set(section.zeroPointIds || []);
  const presetColor = (v) => { const i = data.presets.indexOf(v); return i>=0 ? PALETTE[i%PALETTE.length] : '#2a2a26'; };

  let segRunning = 0, absRunning = 0;
  const display = rows.map(r => {
    const isZero = zeroIds.has(r.id);
    if (isZero) segRunning = 0;
    segRunning += r.value; absRunning += r.value;
    return { ...r, segTotal: segRunning, absTotal: absRunning, isZero };
  });

  const grandTotal = rows.reduce((s,r)=>s+r.value,0);
  const checkedCount = rows.filter(r=>r.checked).length;
  const checkedTotal = rows.filter(r=>r.checked).reduce((s,r)=>s+r.value,0);

  let previewRunning = grandTotal;
  const previewChips = (preview||[]).map(v => { previewRunning+=v; return {v,t:previewRunning}; });

  const updateSection = (fn) => update(d => ({
    ...d, sections: d.sections.map(s => s.id===d.activeId ? {...s,...fn(s)} : s)
  }));
  const updateRows = (fn) => updateSection(s => ({ rows: fn(s.rows) }));

  const handleAdd = () => {
    if (!expr.trim()) return;
    const parsed = parseExpr(expr);
    if (!parsed) { setError('Tarkista syöte, esim. 330x4+630x2'); return; }
    setError('');
    updateRows(rows => [...rows, ...expand(parsed).map(makeRow)]);
    setExpr(''); setPreview(null);
    inputRef.current?.focus();
  };

  const handleExprChange = (val) => {
    setExpr(val); setError('');
    clearTimeout(previewTimer.current);
    previewTimer.current = setTimeout(() => {
      if (!val.trim()) { setPreview(null); return; }
      const p = parseExpr(val);
      setPreview(p ? expand(p) : null);
    }, 120);
  };

  const toggleCheck = (id) => updateRows(rows => rows.map(r => r.id===id ? {...r,checked:!r.checked} : r));
  const removeRow = (id) => updateSection(s => ({
    rows: s.rows.filter(r=>r.id!==id),
    zeroPointIds: (s.zeroPointIds||[]).filter(z=>z!==id)
  }));
  const toggleZero = (id) => updateSection(s => {
    const zids = s.zeroPointIds||[];
    return { zeroPointIds: zids.includes(id) ? zids.filter(z=>z!==id) : [...zids,id] };
  });
  const clearChecks = () => updateRows(rows => rows.map(r=>({...r,checked:false})));
  const resetSection = () => { if(window.confirm(`Nollataan ${section.name}?`)) updateSection(()=>({rows:[],zeroPointIds:[]})); };

  const addSection = () => {
    const id = uid();
    const n = data.sections.length + 1;
    update(d => ({...d, sections:[...d.sections,{id,name:`Seinä ${n}`,rows:[],zeroPointIds:[]}], activeId:id}));
  };
  const deleteSection = (id) => {
    if (data.sections.length<=1) return;
    update(d => {
      const sections = d.sections.filter(s=>s.id!==id);
      const activeId = d.activeId===id ? sections[sections.length-1].id : d.activeId;
      return {...d,sections,activeId};
    });
    setConfirmDelete(null);
  };
  const requestDelete = (id) => {
    if (confirmDelete===id) { deleteSection(id); return; }
    setConfirmDelete(id);
    clearTimeout(confirmTimer.current);
    confirmTimer.current = setTimeout(()=>setConfirmDelete(null), 3000);
  };
  const startRename = (s) => { setRenamingId(s.id); setRenameVal(s.name); setTimeout(()=>renameRef.current?.select(),40); };
  const commitRename = () => {
    if (renameVal.trim()) update(d=>({...d,sections:d.sections.map(s=>s.id===renamingId?{...s,name:renameVal.trim()}:s)}));
    setRenamingId(null);
  };

  const addPreset = () => {
    const v = parseInt(newPreset);
    if (!v||data.presets.includes(v)) return;
    update(d=>({...d,presets:[...d.presets,v]}));
    setNewPreset('');
  };
  const removePreset = (v) => update(d=>({...d,presets:d.presets.filter(p=>p!==v)}));

  const btnSmall = (danger) => ({
    background:'transparent', border:`1px solid ${danger?'#e0b0a8':'#d0ccc4'}`,
    borderRadius:2, color:danger?'#c06050':'#999', fontSize:11,
    fontFamily:'inherit', padding:'6px 12px', cursor:'pointer', letterSpacing:'.06em'
  });

  return (
    <div style={{minHeight:'100vh',minHeight:'100dvh',background:'#f5f2ec',fontFamily:"'Courier New',Courier,monospace",padding:'max(env(safe-area-inset-top,12px),16px) 16px env(safe-area-inset-bottom,16px)',boxSizing:'border-box'}}>
      <div style={{maxWidth:560,margin:'0 auto'}}>

        <div style={{fontSize:10,letterSpacing:'.15em',color:'#999',textTransform:'uppercase',marginBottom:2}}>Metallijulkisivu · Kasettilaskuri</div>
        <div style={{fontSize:20,fontWeight:'bold',color:'#2a2a26',marginBottom:14}}>Moduulimittalista</div>

        {/* Tabs */}
        <div style={{display:'flex',gap:6,marginBottom:10,overflowX:'auto',paddingBottom:4,alignItems:'center'}}>
          {data.sections.map(s => {
            const active = s.id===data.activeId;
            const pending = confirmDelete===s.id;
            return (
              <div key={s.id} style={{display:'flex',alignItems:'center',gap:3,flexShrink:0}}>
                {active && renamingId===s.id ? (
                  <input ref={renameRef} value={renameVal} onChange={e=>setRenameVal(e.target.value)}
                    onBlur={commitRename} onKeyDown={e=>{if(e.key==='Enter')commitRename();if(e.key==='Escape')setRenamingId(null);}}
                    style={{border:'1px solid #c8a86b',borderRadius:2,padding:'5px 8px',fontSize:13,fontFamily:'inherit',color:'#2a2a26',background:'#fff',outline:'none',width:90}}/>
                ) : (
                  <button onClick={()=>active?startRename(s):update(d=>({...d,activeId:s.id}))}
                    style={{background:active?'#2a2a26':'#f0ede8',border:`1px solid ${active?'#2a2a26':'#d0ccc4'}`,borderRadius:2,color:active?'#c8a86b':'#888',fontSize:12,fontFamily:'inherit',padding:'6px 10px',cursor:'pointer',whiteSpace:'nowrap'}}>
                    {s.name}{active&&<span style={{marginLeft:4,fontSize:9,opacity:.5}}>✎</span>}
                  </button>
                )}
                {data.sections.length>1&&(
                  <button onClick={()=>requestDelete(s.id)}
                    style={{background:pending?'#c06050':'transparent',border:`1px solid ${pending?'#c06050':'#e0ddd8'}`,borderRadius:2,color:pending?'#fff':'#ccc',fontSize:10,padding:'5px 7px',cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}}>
                    {pending?'poista?':'✕'}
                  </button>
                )}
              </div>
            );
          })}
          <button onClick={addSection} style={{background:'transparent',border:'1px dashed #d0ccc4',borderRadius:2,color:'#aaa',fontSize:12,fontFamily:'inherit',padding:'6px 12px',cursor:'pointer',flexShrink:0}}>
            + seinä
          </button>
        </div>

        {/* Input */}
        <div style={{background:'#fff',border:'1px solid #d8d4cc',borderRadius:2,padding:'14px 16px',marginBottom:10}}>
          <div style={{fontSize:10,color:'#999',letterSpacing:'.12em',marginBottom:8}}>
            SYÖTE · esim. <span style={{color:'#c8a86b'}}>330x4+630x2+330</span>
          </div>
          <div style={{display:'flex',gap:8}}>
            <input ref={inputRef} value={expr} onChange={e=>handleExprChange(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&handleAdd()} placeholder="330x4+630x5" autoFocus
              style={{flex:1,border:`1px solid ${error?'#c06050':'#d0ccc4'}`,borderRadius:2,padding:'10px 12px',fontSize:16,fontFamily:'inherit',background:'#faf9f7',color:'#2a2a26',outline:'none',minWidth:0}}/>
            <button onClick={handleAdd} style={{background:'#2a2a26',border:'none',borderRadius:2,color:'#c8a86b',fontSize:13,fontFamily:'inherit',fontWeight:'bold',padding:'10px 16px',cursor:'pointer',letterSpacing:'.08em',whiteSpace:'nowrap'}}>
              + LISÄÄ
            </button>
          </div>
          {error&&<div style={{color:'#c06050',fontSize:11,marginTop:6}}>{error}</div>}

          <div style={{display:'flex',gap:8,marginTop:10,alignItems:'center',flexWrap:'wrap'}}>
            {data.presets.map(v=>(
              <div key={v} style={{display:'flex',alignItems:'center',gap:3}}>
                <button onClick={()=>updateRows(rows=>[...rows,makeRow(v)])}
                  style={{background:'#f0ede8',border:'1px solid #d0ccc4',borderRadius:2,color:presetColor(v),fontSize:13,fontFamily:'inherit',padding:'6px 12px',cursor:'pointer',fontWeight:'bold'}}>
                  +{v}
                </button>
                {editingPresets&&<button onClick={()=>removePreset(v)} style={{background:'transparent',border:'none',color:'#c06050',fontSize:12,cursor:'pointer',padding:'0 2px'}}>✕</button>}
              </div>
            ))}
            {editingPresets&&(
              <div style={{display:'flex',gap:4,alignItems:'center'}}>
                <input value={newPreset} onChange={e=>setNewPreset(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addPreset()}
                  placeholder="uusi" style={{width:58,border:'1px solid #d0ccc4',borderRadius:2,padding:'5px 8px',fontSize:13,fontFamily:'inherit',background:'#faf9f7',color:'#2a2a26',outline:'none'}}/>
                <button onClick={addPreset} style={{background:'transparent',border:'1px solid #d0ccc4',borderRadius:2,color:'#999',fontSize:11,fontFamily:'inherit',padding:'5px 8px',cursor:'pointer'}}>+</button>
              </div>
            )}
            <button onClick={()=>setEditingPresets(e=>!e)} style={{marginLeft:'auto',background:'transparent',border:'none',color:editingPresets?'#c8a86b':'#ccc',fontSize:11,fontFamily:'inherit',cursor:'pointer',letterSpacing:'.08em'}}>
              {editingPresets?'valmis':'muokkaa'}
            </button>
          </div>

          {previewChips.length>0&&(
            <div style={{marginTop:10,borderTop:'1px dashed #e0ddd8',paddingTop:8}}>
              <div style={{fontSize:10,color:'#999',letterSpacing:'.1em',marginBottom:6}}>
                ESIKATSELU · {previewChips.length} mittaa, +{fmt(preview.reduce((s,v)=>s+v,0))} mm
              </div>
              <div style={{display:'flex',flexWrap:'wrap',gap:'3px 6px'}}>
                {previewChips.map(({v,t},i)=>(
                  <span key={i} style={{fontSize:11,color:'#c8a86b',background:'#faf7f0',border:'1px solid #e8dfc8',borderRadius:2,padding:'2px 6px'}}>
                    {fmt(v)} → <strong>{fmt(t)}</strong>
                  </span>
                ))}
              </div>
            </div>
          )}
        </div>

        {/* Table */}
        {rows.length>0 ? (
          <>
            <div style={{background:'#fff',border:'1px solid #d8d4cc',borderRadius:2,overflow:'hidden',marginBottom:10}}>
              <div style={{display:'grid',gridTemplateColumns:'28px 28px 72px 100px 26px 24px',background:'#f0ede8',borderBottom:'1px solid #d8d4cc',padding:'7px 10px',fontSize:10,color:'#999',letterSpacing:'.1em',gap:4}}>
                <span>✓</span><span>#</span><span>MITTA</span><span>JUOKSEVA</span><span>↺</span><span/>
              </div>
              <div style={{maxHeight:'45vh',overflowY:'auto',WebkitOverflowScrolling:'touch'}}>
                {display.map((r,i)=>(
                  <div key={r.id}>
                    {r.isZero&&(
                      <div style={{display:'flex',alignItems:'center',gap:8,padding:'4px 10px',background:'#fff8ee',borderBottom:'1px solid #f0e8d0',borderTop:'1px solid #f0e8d0'}}>
                        <div style={{flex:1,height:1,background:'#e8d4a0'}}/>
                        <span style={{fontSize:10,color:'#c8a86b',letterSpacing:'.1em',whiteSpace:'nowrap'}}>↺ TEIPPI NOLLATTU</span>
                        <div style={{flex:1,height:1,background:'#e8d4a0'}}/>
                      </div>
                    )}
                    <div onClick={()=>toggleCheck(r.id)} style={{display:'grid',gridTemplateColumns:'28px 28px 72px 100px 26px 24px',padding:'7px 10px',gap:4,alignItems:'center',borderBottom:'1px solid #f0ede8',cursor:'pointer',background:r.checked?'#f7f5f0':'#fff'}}>
                      <div style={{width:16,height:16,border:`2px solid ${r.checked?'#c8a86b':'#ccc'}`,borderRadius:2,display:'flex',alignItems:'center',justifyContent:'center',background:r.checked?'#c8a86b':'transparent',fontSize:10,color:'#fff',fontWeight:'bold',flexShrink:0}}>
                        {r.checked?'✓':''}
                      </div>
                      <span style={{fontSize:11,color:'#bbb'}}>{i+1}</span>
                      <span style={{fontSize:14,fontWeight:'bold',color:r.checked?'#bbb':presetColor(r.value),textDecoration:r.checked?'line-through':'none'}}>
                        {fmt(r.value)}
                      </span>
                      <div>
                        <span style={{fontSize:14,fontWeight:r.checked?'normal':'bold',color:r.checked?'#bbb':'#2a2a26'}}>{fmt(r.segTotal)}</span>
                        {r.segTotal!==r.absTotal&&<span style={{fontSize:10,color:'#bbb',marginLeft:4}}>/{fmt(r.absTotal)}</span>}
                      </div>
                      <button onClick={e=>{e.stopPropagation();toggleZero(r.id);}}
                        style={{background:'transparent',border:`1px solid ${r.isZero?'#c8a86b':'#e8e4de'}`,borderRadius:2,color:r.isZero?'#c8a86b':'#d8d4cc',fontSize:11,padding:'2px 4px',cursor:'pointer',lineHeight:1}}>
                        ↺
                      </button>
                      <span onClick={e=>{e.stopPropagation();removeRow(r.id);}} style={{color:'#ddd',fontSize:12,textAlign:'center',cursor:'pointer'}}>✕</span>
                    </div>
                  </div>
                ))}
              </div>
              <div style={{borderTop:'2px solid #d8d4cc',padding:'10px 12px',display:'flex',justifyContent:'space-between',alignItems:'center',background:'#faf9f7'}}>
                <div style={{fontSize:11,color:'#999'}}>{rows.length} mittaa · {checkedCount} merkitty</div>
                <div style={{textAlign:'right'}}>
                  {checkedCount>0&&<div style={{fontSize:11,color:'#bbb',marginBottom:2}}>Merkitty: {fmt(checkedTotal)} mm</div>}
                  <div style={{fontSize:16,fontWeight:'bold',color:'#2a2a26'}}>Yht. {fmt(grandTotal)} mm</div>
                </div>
              </div>
            </div>
            <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginBottom:12}}>
              <button onClick={clearChecks} style={btnSmall(false)}>TYHJENNÄ MERKIT</button>
              <button onClick={resetSection} style={btnSmall(true)}>NOLLAA LISTA</button>
            </div>
          </>
        ) : (
          <div style={{textAlign:'center',padding:'40px 0',color:'#ccc',fontSize:12,letterSpacing:'.08em'}}>
            Lisää mittoja syöttökentästä
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
</script>
</body>
</html>
